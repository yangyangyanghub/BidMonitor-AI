# BidMonitor AI - Nginx 反向代理配置
# 安装: sudo cp bidmonitor-nginx.conf /etc/nginx/sites-available/bidmonitor
# 启用: sudo ln -s /etc/nginx/sites-available/bidmonitor /etc/nginx/sites-enabled/
# 测试: sudo nginx -t
# 重载: sudo systemctl reload nginx

# HTTP 服务器配置
server {
    listen 80;
    listen [::]:80;
    server_name your_domain.com;  # 替换为实际域名

    # 字符集
    charset utf-8;

    # 客户端请求体大小限制（支持文件上传）
    client_max_body_size 50M;

    # 日志配置
    access_log /var/log/nginx/bidmonitor-access.log;
    error_log /var/log/nginx/bidmonitor-error.log;

    # ============================================================
    # HTTPS 重定向（启用 Let's Encrypt 后取消注释）
    # ============================================================
    # return 301 https://$server_name$request_uri;

    # ============================================================
    # Let's Encrypt 证书验证路径
    # ============================================================
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ============================================================
    # 静态文件缓存
    # ============================================================
    location /static/ {
        alias /opt/bidmonitor/server/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        gzip_static on;

        # 常见静态文件类型
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 365d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ============================================================
    # 反向代理到 FastAPI 应用
    # ============================================================
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # 基础代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # 禁用代理缓冲（实时日志需要）
        proxy_buffering off;
        proxy_cache off;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;  # 长连接支持（日志流）

        # ============================================================
        # WebSocket 支持（用于实时日志）
        # ============================================================
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # WebSocket 超时
        proxy_read_timeout 86400s;  # 24小时，保持 WebSocket 长连接
        proxy_send_timeout 86400s;
    }

    # ============================================================
    # 安全头配置
    # ============================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 隐藏 Nginx 版本
    server_tokens off;
}

